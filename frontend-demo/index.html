<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turniej — organizacja turniejów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Turniej<span>.</span></div>
    <div class="role-box">
      <label>Tryb</label>
      <select id="roleSelect">
        <option value="organizer">Organizator</option>
        <option value="viewer">Widz</option>
      </select>
    </div>
    <nav id="nav">
      <button class="navbtn active" data-view="list">Turnieje</button>
      <button class="navbtn" data-view="create">Nowy turniej</button>
      <button class="navbtn" data-view="bracket">Drabinka</button>
    </nav>
    <div class="sidebar-foot">Demo frontendowe<br>logika jak w projekcie C#</div>
  </aside>
  <main class="main">
    <div id="view-list" class="view"></div>
    <div id="view-create" class="view hidden"></div>
    <div id="view-bracket" class="view hidden"></div>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
